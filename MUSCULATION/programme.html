<style>
@page { margin: 12mm 13mm; size: A4; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:'Inter',Arial,sans-serif;color:#111827;background:#fff;font-size:9pt;line-height:1.5;overflow-x:hidden}

.print-btn{position:fixed;top:76px;right:18px;background:#e8960a;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(232,150,10,.4);z-index:999}
.print-btn:hover{background:#d4860a}
@media print{.print-btn{display:none}.pb{page-break-before:always}}

.page{max-width:184mm;margin:0 auto;padding:6mm 0}

/* DOC HEADER */
.doc-header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:10px;margin-bottom:18px;border-bottom:3px solid #0b1020}
.doc-logo{font-size:30pt;font-weight:900;letter-spacing:6px;color:#0b1020;line-height:1}
.doc-logo span{color:#e8960a}
.doc-meta{text-align:right;font-size:7.5pt;color:#6b7280;text-transform:uppercase;letter-spacing:1px}
.doc-meta b{color:#111}

/* SECTION HEADING */
.sh{font-size:13pt;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#e8960a;border-bottom:2px solid #e8960a;padding-bottom:5px;margin-bottom:14px;margin-top:20px}
.sh:first-child{margin-top:0}

/* PROFILE CARDS */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.card{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px}
.card h2,.card h3{font-size:7pt;text-transform:uppercase;letter-spacing:1.5px;color:#9ca3af;margin-bottom:7px;font-weight:700}
.row{display:flex;justify-content:space-between;font-size:8.5pt;padding:2.5px 0;border-bottom:1px solid #f9fafb}
.row:last-child{border-bottom:none}
.lbl{color:#6b7280}
.val{font-weight:700;color:#111}
.val.gold{color:#e8960a}
.val.red{color:#dc2626}

/* WEEK CALENDAR */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
.day{border-radius:7px;padding:7px 4px;text-align:center}
.day.training{background:#0b1020;color:#fff}
.day.rest{background:#f3f4f6;color:#9ca3af}
.day.activity{background:#1e3a8a;color:#fff}
.day-lbl{font-size:6.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;opacity:.6}
.day-name{font-size:8pt;font-weight:800}
.day-time{font-size:7pt;margin-top:2px;opacity:.8}
.day.training .day-name{color:#e8960a}

/* OBJECTIVE CARDS */
.obj-card{border:1px solid #e5e7eb;border-radius:8px;padding:10px;text-align:center}
.obj-lbl{font-size:7pt;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;margin-bottom:4px;font-weight:700}
.obj-cur{font-size:13pt;font-weight:900;color:#111;line-height:1}
.obj-arr{font-size:8pt;color:#9ca3af;margin:2px 0}
.obj-tgt{font-size:11pt;font-weight:900;color:#e8960a}

/* MACRO BAR */
.macro-bar{display:flex;background:#0b1020;border-radius:8px;padding:10px 16px;margin-bottom:14px;justify-content:space-around;align-items:center;gap:12px}
.mb-item{text-align:center;color:#fff}
@media screen and (max-width:600px){.macro-bar{flex-wrap:wrap;justify-content:center;padding:10px}.mb-item{flex:1 1 40%;min-width:0}}
.mb-val{font-size:15pt;font-weight:900;color:#e8960a;line-height:1}
.mb-lbl{font-size:6.5pt;text-transform:uppercase;letter-spacing:1px;opacity:.55;margin-top:2px}

/* SESSION BANNER */
.session-banner{border-radius:10px;padding:11px 15px;margin-bottom:13px;color:#fff}
.sb-push{background:linear-gradient(135deg,#991b1b,#dc2626)}
.sb-pull{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.sb-vs{background:linear-gradient(135deg,#4c1d95,#7c3aed)}
.sb-row{display:flex;justify-content:space-between;align-items:flex-start}
.sb-name{font-size:17pt;font-weight:900;letter-spacing:3px;line-height:1}
.sb-right{text-align:right}
.sb-day{font-size:10pt;font-weight:700}
.sb-focus{font-size:7.5pt;opacity:.75;margin-top:2px}
.sb-tags{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.sb-tag{font-size:7.5pt;background:rgba(255,255,255,.15);padding:2px 9px;border-radius:100px}

/* EXERCISE */
.ex{border:1px solid #e5e7eb;border-radius:8px;margin-bottom:9px;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:8px;padding:6px 11px;font-weight:700;font-size:9pt}
.ex-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7.5pt;font-weight:900;flex-shrink:0}
.ex-name-col{flex:1}
.ex-name{font-weight:700}
.ex-muscle{font-size:7.5pt;font-weight:500;opacity:.65;margin-top:0px}

.push-ex .ex-head{background:#fef2f2;border-bottom:2px solid #fca5a5}
.push-ex .ex-num{background:#dc2626;color:#fff}
.push-ex .ex-name{color:#991b1b}
.pull-ex .ex-head{background:#eff6ff;border-bottom:2px solid #93c5fd}
.pull-ex .ex-num{background:#2563eb;color:#fff}
.pull-ex .ex-name{color:#1e40af}
.vs-ex .ex-head{background:#f5f3ff;border-bottom:2px solid #c4b5fd}
.vs-ex .ex-num{background:#7c3aed;color:#fff}
.vs-ex .ex-name{color:#4c1d95}
.core-ex .ex-head{background:#f0fdf4;border-bottom:2px solid #86efac}
.core-ex .ex-num{background:#16a34a;color:#fff}
.core-ex .ex-name{color:#14532d}

.ex-body{padding:7px 11px}
.ex-stats{display:flex;gap:14px;margin-bottom:5px;flex-wrap:wrap}
.ex-s{font-size:8pt}
.ex-s-lbl{font-size:6.5pt;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;font-weight:700}
.ex-s-val{font-weight:700;color:#111;font-size:8.5pt}
.ex-equip{font-size:7.5pt;color:#6b7280;margin-bottom:4px}
.ex-tips{font-size:8pt;color:#374151;margin-top:3px}
.ex-tips li{list-style:none;padding-left:12px;position:relative;padding-bottom:1px}
.ex-tips li::before{content:"·";position:absolute;left:2px;color:#e8960a;font-weight:900;font-size:11pt;top:-4px}

.alert-gold{display:flex;gap:5px;background:#fffbeb;border-left:3px solid #e8960a;padding:4px 8px;border-radius:0 5px 5px 0;margin-top:5px;font-size:7.5pt;color:#92400e}
.alert-red{display:flex;gap:5px;background:#fef2f2;border-left:3px solid #dc2626;padding:4px 8px;border-radius:0 5px 5px 0;margin-top:5px;font-size:7.5pt;color:#991b1b;font-weight:600}

/* FINISHER */
.finisher{background:#0b1020;border-radius:8px;padding:9px 13px;color:#fff;margin-bottom:10px}
.finisher-title{font-size:7.5pt;text-transform:uppercase;letter-spacing:1.5px;color:#e8960a;font-weight:700;margin-bottom:5px}
.finisher-exs{display:flex;gap:8px;flex-wrap:wrap}
.finisher-ex{font-size:8pt;background:rgba(255,255,255,.1);padding:3px 10px;border-radius:100px}

/* NOTES / ALERTS */
.info-box{border-radius:8px;padding:9px 13px;margin-bottom:12px}
.info-box.blue{background:#1e3a8a;color:#fff}
.info-box.red{background:#dc2626;color:#fff}
.info-box.green{background:#14532d;color:#fff}
.info-box.gold{background:#fff7e6;color:#4a3410;border:1px solid #f3d08a}
.info-box h3,.info-box h4{font-size:7.5pt;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;opacity:.75}
.info-box p{font-size:8.5pt;opacity:.95;line-height:1.55}

/* NUTRITION MEALS */
.meal-item{display:grid;grid-template-columns:52px 1fr;gap:9px;margin-bottom:7px;align-items:start}
.m-time{font-size:11pt;font-weight:900;color:#e8960a;line-height:1;text-align:center}
.m-tag{font-size:6pt;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;font-weight:700;text-align:center;margin-top:2px}
.m-card{border:1px solid #e5e7eb;border-radius:7px;padding:7px 10px}
.m-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.m-name{font-weight:700;font-size:8.5pt}
.m-kcal{font-size:8.5pt;font-weight:700;color:#e8960a}
.m-macros{display:flex;gap:5px;margin-bottom:4px}
.mp{font-size:7pt;font-weight:700;padding:1.5px 6px;border-radius:100px}
.mp.p{background:#fff7ed;color:#c2410c}
.mp.c{background:#eff6ff;color:#1d4ed8}
.mp.f{background:#fdf4ff;color:#7e22ce}
.m-foods{list-style:none}
.m-foods li{font-size:7.5pt;color:#374151;padding:1px 0 1px 11px;position:relative}
.m-foods li::before{content:"·";position:absolute;left:1px;color:#e8960a;font-weight:900;font-size:11pt;top:-4px}
.m-note{font-size:7pt;color:#9ca3af;font-style:italic;margin-top:3px;border-top:1px solid #f3f4f6;padding-top:3px}

/* REST DAY */
.rest-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rest-card{background:#f9fafb;border-radius:7px;padding:8px 10px;font-size:8pt}
.rest-card strong{display:block;font-size:7pt;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;margin-bottom:3px}

/* SUPPLEMENTS */
.supp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.supp-card{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px}
.supp-name{font-weight:800;font-size:9pt;margin-bottom:1px}
.supp-brand{font-size:7pt;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.supp-row{font-size:8pt;color:#374151;padding:2px 0;border-bottom:1px solid #f9fafb}
.supp-row:last-child{border-bottom:none}
.supp-row b{color:#111}

/* STRENGTH TABLE */
.strength-table{width:100%;border-collapse:collapse;font-size:8.5pt}
.strength-table th{background:#0b1020;color:#fff;padding:6px 10px;text-align:left;font-size:7.5pt;letter-spacing:.8px;text-transform:uppercase;font-weight:700}
.strength-table td{padding:6px 10px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.strength-table tr:last-child td{border-bottom:none}
.t-start{color:#6b7280}
.t-tgt{color:#e8960a;font-weight:700}
.pbar-wrap{background:#f3f4f6;border-radius:100px;height:5px;width:70px;display:inline-block;vertical-align:middle}
.pbar{background:#e8960a;height:5px;border-radius:100px}

.footer{text-align:center;font-size:7pt;color:#9ca3af;border-top:1px solid #e5e7eb;padding-top:8px;margin-top:22px}

/* ── TOUCH ANDROID ── */
button, a, [onclick], input, select, label {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

@media (max-width: 768px) {
  .print-btn { min-height: 44px; }
}

/* ── EXERCISE DETAIL MODAL ── */
a.ex-fiche-btn{text-decoration:none;display:inline-flex;align-items:center}
.ex-fiche-btn{background:rgba(232,150,10,0.12);border:1px solid rgba(232,150,10,0.35);color:#b37200;font-size:7pt;font-weight:700;padding:3px 9px;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;flex-shrink:0;letter-spacing:.3px}
.ex-fiche-btn:hover{background:rgba(232,150,10,0.28);color:#e8960a}
@media print{.ex-fiche-btn{display:none}}
.em-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:9999;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;box-sizing:border-box}
.em-overlay.open{display:flex}
.em-modal{background:#fff;border-radius:16px;width:100%;max-width:700px;box-shadow:0 24px 80px rgba(0,0,0,0.45);margin:auto;overflow:hidden;font-family:'Inter',sans-serif}
.em-hdr{padding:20px 24px 16px;color:#fff;position:relative}
.em-hdr.push{background:linear-gradient(135deg,#991b1b,#dc2626)}
.em-hdr.pull{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.em-hdr.vshape{background:linear-gradient(135deg,#4c1d95,#7c3aed)}
.em-hdr.core{background:linear-gradient(135deg,#14532d,#16a34a)}
.em-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,0.2);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.em-close:hover{background:rgba(255,255,255,0.38)}
.em-icon{font-size:24px;margin-bottom:6px}
.em-name{font-size:18px;font-weight:800;margin-bottom:3px}
.em-mg{font-size:12px;opacity:.8;margin-bottom:10px}
.em-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.em-stat{background:rgba(255,255,255,0.15);border-radius:7px;padding:7px 8px;text-align:center}
.em-stat-val{font-weight:800;font-size:13px;display:block}
.em-stat-key{font-size:8px;opacity:.7;text-transform:uppercase;letter-spacing:.4px;margin-top:1px;display:block}
.em-ratings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.em-rlbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.75}
.em-stars{display:flex;gap:1px}
.em-star{font-size:10px;color:rgba(255,255,255,0.3)}
.em-star.on{color:#f0a500}
.em-rsep{color:rgba(255,255,255,0.3);font-size:9px;margin:0 2px}
.em-yt-zone{padding:10px 24px;background:#f7f4ef;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #e5e0d5}
.em-yt-btn{display:inline-flex;align-items:center;gap:6px;background:#ff0000;color:#fff;padding:6px 14px;border-radius:7px;text-decoration:none;font-size:11px;font-weight:700;transition:background .15s}
.em-yt-btn:hover{background:#cc0000}
.em-equip-tag{font-size:10px;color:#6b7280;background:#fff;padding:4px 9px;border-radius:5px;border:1px solid #e5e0d5}
.em-tabs{display:flex;border-bottom:2px solid #e5e0d5;background:#f7f4ef}
.em-tab{flex:1;padding:9px 4px;font-size:10px;font-weight:700;color:#9ca3af;background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;text-transform:uppercase;letter-spacing:.4px;font-family:'Inter',sans-serif}
.em-tab:hover{color:#374151}
.em-tab.active{color:#dc2626;border-bottom-color:#dc2626}
.em-tab.active.pull{color:#2563eb;border-bottom-color:#2563eb}
.em-tab.active.vshape{color:#7c3aed;border-bottom-color:#7c3aed}
.em-tab.active.core{color:#16a34a;border-bottom-color:#16a34a}
.em-panel{display:none;padding:18px 24px 24px}
.em-panel.active{display:block}
.em-iblk{background:#f7f4ef;border-radius:9px;padding:10px 13px;margin-bottom:9px}
.em-iblk-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;margin-bottom:5px}
.em-iblk-v{font-size:13px;color:#374151;line-height:1.55}
.em-breath{background:linear-gradient(135deg,rgba(21,96,212,0.05),rgba(232,150,10,0.05));border:1px solid rgba(232,150,10,0.2)}
.em-steps{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.em-steps li{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#374151;line-height:1.5}
.em-snum{width:20px;height:20px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.em-snum.push{background:#dc2626}
.em-snum.pull{background:#2563eb}
.em-snum.vshape{background:#7c3aed}
.em-snum.core{background:#16a34a}
.em-iblk-t2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#9ca3af;margin-bottom:8px}
.em-chk{list-style:none;display:flex;flex-direction:column;gap:4px}
.em-chk li{font-size:12px;color:#374151;display:flex;align-items:flex-start;gap:6px}
.em-chk li::before{content:'✓';color:#0a9e52;font-weight:700;flex-shrink:0}
.em-map-wrap{display:flex;justify-content:center;padding:6px 0 12px}
.em-lbls{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.em-lbl{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600}
.em-lbl-p{background:rgba(232,150,10,0.15);color:#a66800}
.em-lbl-s{background:rgba(21,96,212,0.1);color:#1560d4}
.em-errs{display:flex;flex-direction:column;gap:9px}
.em-ecard{border-radius:9px;overflow:hidden;border:1px solid #e5e0d5}
.em-ebad{background:rgba(220,53,69,0.06);padding:9px 12px}
.em-egood{background:rgba(10,158,82,0.06);padding:9px 12px}
.em-elbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.em-ebad .em-elbl{color:#c0392b}
.em-egood .em-elbl{color:#0a9e52}
.em-etxt{font-size:12px;color:#374151}
.em-injlist{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.em-inj-item{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:#374151;background:rgba(255,165,0,0.06);border:1px solid rgba(255,165,0,0.18);border-radius:8px;padding:8px 10px}
.em-note{border-radius:9px;padding:11px 13px;margin-bottom:8px;font-size:12px;line-height:1.55;color:#374151}
.em-note-pe{background:rgba(124,16,212,0.07);border-left:3px solid #7c10d4}
.em-note-sc{background:rgba(21,96,212,0.07);border-left:3px solid #1560d4}
.em-note-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.em-note-pe .em-note-t{color:#7c10d4}
.em-note-sc .em-note-t{color:#1560d4}
@media(max-width:480px){.em-stats-row{grid-template-columns:repeat(2,1fr)}.em-modal{border-radius:12px}.em-overlay{padding:8px}}
@media print{.em-overlay{display:none!important}}
/* ── WEB NAV (écran uniquement — masquée à l'impression) ── */
@media screen{
  .web-nav{position:fixed;top:0;left:0;right:0;z-index:9000;background:#0b1020;display:flex;align-items:center;gap:2px;padding:0 16px;height:46px;font-family:'Inter',sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.3);overflow-x:auto}
  .web-nav-logo{color:#e8960a;font-weight:900;font-size:.92rem;letter-spacing:3px;text-decoration:none;margin-right:10px;white-space:nowrap;flex-shrink:0}
  .web-nav a:not(.web-nav-logo){color:rgba(255,255,255,.65);text-decoration:none;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;transition:all .2s;white-space:nowrap}
  .web-nav a:not(.web-nav-logo):hover{color:#fff;background:rgba(255,255,255,.1)}
  .web-nav a.active{color:#e8960a!important;background:rgba(232,150,10,.15)!important}
  .web-nav-spacer{height:72px}
  .print-btn{top:56px!important}
  .web-nav{-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .web-nav::-webkit-scrollbar{display:none;}
}
/* ── ACCESSIBILITÉ ── */
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px;}
</style>
<style id="az-contraste">
/* Contraste WCAG AA (phase 5, généré par _prive/gen/phase5_contraste.js) */
.print-btn { color: #0b1020 !important; }
.doc-logo span { color: #8a5800 !important; }
.sh { color: #8a5800 !important; }
.card h2 { color: #6b7484 !important; }
.gold.val { color: #8a5800 !important; }
.day-lbl { opacity: 1 !important; }
.day.rest .day-lbl, .day.rest .day-name { color: #5b6270 !important; }
.day.training .day-lbl, .day.activity .day-lbl { color: #d6d9e0 !important; }
.day.activity .day-name { color: #fff !important; }
.obj-lbl { color: #6b7484 !important; }
.obj-tgt { color: #8a5800 !important; }
.footer { color: #6b7484 !important; }
.ex-fiche-btn { color: #8a5800 !important; }
.ex-s-lbl { color: #6b7484 !important; }
a[href$="exercices.html#ex3"] { color: #8a5800 !important; }
a[href$="exercices.html#ex4"] { color: #8a5800 !important; }
a[href$="exercices.html#ex5"] { color: #8a5800 !important; }
a[href$="exercices.html#ex7"] { color: #8a5800 !important; }
.doc-header span { color: #8a5800 !important; }
.m-time { color: #8a5800 !important; }
.m-tag { color: #6b7484 !important; }
.m-kcal { color: #8a5800 !important; }
.m-note { color: #6b7484 !important; }
.supp-brand { color: #6b7484 !important; }
.t-tgt { color: #8a5800 !important; }

@media screen { .ex-fiche-btn { min-height: 44px !important; display: inline-flex !important; align-items: center; } }

</head>
<body>
<a class="az-skip" href="#contenu">Aller au contenu</a>
<div class="az-banners" data-az-banners></div><script>ALLEZ.rappels()</script>

<nav class="az-topnav" data-az-nav aria-label="Navigation principale"></nav>
<div class="web-nav-spacer"></div>

<button class="print-btn" type="button" data-action="imprimer">🖨️ Imprimer / Sauvegarder en PDF</button>

<!-- Les 7 pages sont générées depuis core.js + data/*.js (aucune donnée dans cette page) -->
<main id="contenu"><h1 class="az-sr">Programme imprimable</h1><div id="doc"></div></main>

<script>
(function () {
  const P = ALLEZ.PROGRAM, N = ALLEZ.NUTRITION.current(), S = ALLEZ.SUPPLEMENTS, M = ALLEZ.MEALS, G = ALLEZ.GOALS, pr = ALLEZ.profile();
  const f = ALLEZ.fmt, esc = ALLEZ.esc, int = ALLEZ.int;
  const heure = X => ALLEZ.hourText(X.slot + ':0');
  const TOTAL = 1 + P.ORDER.length + 4;
  const SB = { push: 'sb-push', pull: 'sb-pull', vshape: 'sb-vs' }, EXC = { push: 'push-ex', pull: 'pull-ex', vshape: 'vs-ex' };
  const row = (l, v, c) => `<div class="row"><span class="lbl">${l}</span><span class="val${c ? ' ' + c : ''}">${v}</span></div>`;
  const foot = (t, n) => `<div class="footer">ALLEZ · ${t} · Page ${n}/${TOTAL}</div>`;
  const gain = f(G.leanGainLow, '+n') + ' à ' + f(G.leanGainHigh, '+n');

  // ── PAGE 1 : vue d'ensemble ──
  function page1() {
    const jours = ['LUN', 'MAR', 'MER', 'JEU', 'VEN', 'SAM', 'DIM'].map((lbl, i) => {
      const dn = (i + 1) % 7, X = P.sessionForDay(dn), o = P.otherDays[dn];
      if (X) return `<div class="day training"><div class="day-lbl">${lbl}</div><div class="day-name">${X.name}</div><div class="day-time">${heure(X) || 'Séance'}</div></div>`;
      if (o) return `<div class="day activity"><div class="day-lbl">${lbl}</div><div class="day-name">Ping-pong</div><div class="day-time">Club ${f(N.pingpongHeures, 'n')} h</div></div>`;
      return `<div class="day rest"><div class="day-lbl">${lbl}</div><div class="day-name">Repos</div><div class="day-time">~</div></div>`;
    }).join('');
    const obj = (l, a, b) => `<div class="obj-card"><div class="obj-lbl">${l}</div><div class="obj-cur">${a}</div><div class="obj-arr">→</div><div class="obj-tgt">${b}</div></div>`;
    const bar = (D, lbl, dark) => `<div><div class="macro-bar"${dark ? ' style="background:#1f2937"' : ''}><div class="mb-item"><div class="mb-val">${int(D.kcal)}</div><div class="mb-lbl">kcal ${lbl}</div></div><div class="mb-item"><div class="mb-val">P ${D.p}g</div><div class="mb-lbl">protéines</div></div><div class="mb-item"><div class="mb-val">C ${D.g}g</div><div class="mb-lbl">glucides</div></div><div class="mb-item"><div class="mb-val">L ${D.l}g</div><div class="mb-lbl">lipides</div></div></div></div>`;
    return `<div class="page">
  <div class="doc-header">
    <div class="doc-logo">ALL<span>EZ</span></div>
    <div class="doc-meta">
      <div>Programme personnalisé · 12 mois</div>
      <div data-prive="programme.lieu" hidden></div>
      <div style="margin-top:4px"><b>${pr.age} ans · ${pr.height} cm · ${f(G.weight0, 'n')} kg · ${f(G.bf0, 'n')} % MG${pr.exemple ? ' (profil d\'exemple)' : ''}</b></div>
    </div>
  </div>
  <div class="sh">Mon Profil &amp; Contexte</div>
  <div class="grid-2" style="margin-bottom:14px">
    <div class="card"><h2>Mensurations de départ</h2>
      ${row('Poids', f(G.weight0, 'n') + ' kg')}${row('Taille', pr.height + ' cm')}${row('Masse grasse', f(G.bf0, 'n') + ' % (' + f(G.fat0, '1') + ' kg)')}${row('Masse maigre', f(G.lean0, '1') + ' kg')}${row('Largeur d\'épaules', f(G.shoulders0, 'n') + ' cm')}${row('Tour de taille', f(G.waist0, 'n') + ' cm')}
    </div>
    <div class="card"><h2>Contexte &amp; programme</h2>
      ${row('Niveau', 'Débutant')}
      <div class="row" id="rowParticularites" hidden><span class="lbl">Particularités</span><span class="val red" data-prive="programme.particularites"></span></div>
      ${row('Stratégie', 'Recomposition corporelle', 'gold')}${row('BMR (Mifflin-St Jeor)', int(N.bmr) + ' kcal')}${row('Dépense moyenne (×' + f(N.activite, '2') + ')', int(N.tdee) + ' kcal')}${row('Split', P.ORDER.map(sid => P.SESSIONS[sid].name.charAt(0) + P.SESSIONS[sid].name.slice(1).toLowerCase()).join(' / '))}
    </div>
  </div>
  <div class="sh">Calendrier Hebdomadaire</div>
  <div class="week">${jours}</div>
  <div class="sh">Objectifs à 12 Mois</div>
  <div class="grid-4">
    ${obj('Poids', f(G.weight0, 'n') + ' kg', '~' + f(G.weight, 'n') + ' kg')}
    ${obj('Masse maigre', f(G.lean0, '1') + ' kg', f(G.leanLow, '1') + ' à ' + f(G.lean, '1') + ' kg')}
    ${obj('Masse grasse', f(G.bf0, 'n') + ' %', f(G.bf, 'n') + ' %')}
    ${obj('Épaules / Taille', f(G.shoulders0, 'n') + ' / ' + f(G.waist0, 'n') + ' cm', '~' + f(G.shoulders, 'n') + ' / ' + f(G.waist, 'n') + ' cm')}
  </div>
  <div class="sh">Calories &amp; Macros</div>
  <div>${bar(N.train, 'muscu')}${bar(N.pingpong, 'ping-pong')}${bar(N.rest, 'repos', true)}</div>
  <div class="info-box blue">
    <h3>Stratégie recomposition</h3>
    <p>Débutant + ${f(G.bf0, 'n')} % de masse grasse = prise musculaire et perte de gras simultanées. Par rapport à la dépense de chaque jour : ${f(N.train.delta, '+int')} kcal les jours de muscu, ${f(N.pingpong.delta, '+int')} kcal les jours de ping-pong, ${f(N.rest.delta, '+int')} kcal au repos. Moyenne hebdomadaire : ${int(N.moyenne)} kcal, soit ≈ ${f(N.ecartMoyen, '+int')} kcal/j par rapport à la maintenance → le gras baisse (~${f(Math.abs(G.dFat) / 12, '2')} kg/mois) pendant que le muscle se construit. Résultat attendu : ${gain} kg de masse maigre, ${f(G.bf0, 'n')} → ${f(G.bf, 'n')} % de masse grasse (${f(G.dFat, '+n')} kg de gras), poids quasi stable (~${f(G.weight, 'n')} kg). Cette dépense est une estimation à ±${Math.round(ALLEZ.NUTRITION.PARAMS.incertitude * 100)} % : bilan toutes les 4 semaines.</p>
  </div>
  ${foot('Programme personnalisé 12 mois', 1)}
</div>`;
  }

  // ── PAGES 2 à 4 : une séance par page ──
  function pageSeance(sid, i) {
    const X = P.SESSIONS[sid], h = heure(X), B = P.BLOCKS;
    const cards = X.items.filter(it => P.EXERCISES[it.ex].type !== 'k'), fin = X.items.filter(it => P.EXERCISES[it.ex].type === 'k');
    const card = (it, n) => {
      const e = P.EXERCISES[it.ex], fi = ALLEZ.fiche(it.ex) || {};
      const rir = ['B1', 'B2', 'B3'].map(c => P.rirFor(e, c)).join(' · ');
      const pec = fi.id ? ALLEZ.prive('fiche.' + fi.id + '.pec') : null, scol = fi.id ? ALLEZ.prive('fiche.' + fi.id + '.scol') : null;
      return `<div class="ex ${EXC[sid]}">
    <div class="ex-head"><div class="ex-num">${n + 1}</div><div class="ex-name-col"><div class="ex-name">${P.displayName(e)}</div><div class="ex-muscle">${fi.mg || e.muscle}</div></div>${fi.id ? `<a class="ex-fiche-btn" href="exercices.html#ex${fi.id}">📋 Fiche</a>` : ''}</div>
    <div class="ex-body">
      <div class="ex-stats">
        <div class="ex-s"><div class="ex-s-lbl">Séries × Reps</div><div class="ex-s-val">${it.sets} × ${it.reps.replace(/ \(.*\)$/, '')}</div></div>
        <div class="ex-s"><div class="ex-s-lbl">Repos</div><div class="ex-s-val">${it.rest} sec</div></div>
        <div class="ex-s"><div class="ex-s-lbl">Tempo</div><div class="ex-s-val">${e.tempo}</div></div>
        <div class="ex-s"><div class="ex-s-lbl">RIR B1·B2·B3</div><div class="ex-s-val">${rir}</div></div>
      </div>
      <div class="ex-equip">${fi.equip || ''}${it.hint ? ' · charge de départ indicative : ' + it.hint : ''}</div>
      <ul class="ex-tips">${e.cue.split(' · ').map(t => `<li>${t.charAt(0).toUpperCase() + t.slice(1)}</li>`).join('')}${e.lombaires === 'prudence' ? `<li>🟠 Bas du dos : ${e.consigne}</li>` : ''}</ul>
      ${pec ? `<div class="alert-gold">🔒 ${esc(pec)}</div>` : ''}${scol ? `<div class="alert-gold">🔒 ${esc(scol)}</div>` : ''}
    </div>
  </div>`;
    };
    return `<div class="page pb">
  <div class="session-banner ${SB[sid]}">
    <div class="sb-row">
      <div><div class="sb-name">${X.name}</div><div class="sb-focus">${X.focus}</div></div>
      <div class="sb-right"><div class="sb-day">${X.label}${h ? ' — ' + h : ''}</div><div class="sb-focus">Durée estimée : ≈ ${P.duration(sid, 'B2')} min (≈ ${P.duration(sid, 'B1')} min au bloc 1)</div></div>
    </div>
    <div class="sb-tags">
      <span class="sb-tag">${cards.length} exercices${fin.length ? ' + ' + fin.length + ' finisher' + (fin.length > 1 ? 's' : '') : ''}</span>
      <span class="sb-tag">${P.totals('B2')[sid]} séries (bloc 1 : ${P.totals('B1')[sid]})</span>
      <span class="sb-tag">RIR selon le bloc : ${B.B1.rirC} · ${B.B2.rirC} · ${B.B3.rirC}/${B.B3.rirI}</span>
    </div>
  </div>
  ${i === 0 ? `<div class="info-box green" style="margin-bottom:10px"><h3>Échauffement — avant chaque séance (${P.WARMUP.duree})</h3><p>${P.WARMUP.etapes.map((e, k) => '①②③④⑤⑥'.charAt(k) + ' ' + e.txt).join(' · ')}</p></div>` : ''}
  <div class="info-box red" data-prive="programme.regles-${sid}" hidden></div>
  ${cards.map(card).join('\n')}
  ${fin.length ? `<div class="finisher"><div class="finisher-title">Finisher Core</div><div class="finisher-exs">${fin.map(it => { const e = P.EXERCISES[it.ex]; return `<span class="finisher-ex">${e.name} — ${it.sets} × ${it.reps}</span><span class="finisher-ex">${e.cue}</span><span class="finisher-ex">Repos ${it.rest} sec</span>`; }).join('')}</div></div>` : ''}
  ${foot('Séance ' + X.name + ' — ' + X.label, i + 2)}
</div>`;
  }

  // ── PAGES 5 et 6 : nutrition des jours de séance ──
  function pageRepas(id, n) {
    const D = M.DAYS[id], t = M.dayTotal(id), c = M.target(id), X = P.ORDER.map(sid => P.SESSIONS[sid]).find(x => x.slot === D.slot), h = X ? heure(X) : null;
    const meal = m => {
      const tt = m.compo ? M.mealTotal(m) : null;
      return `<div class="meal-item">
    <div><div class="m-time">${M.timeText(id, m)}</div><div class="m-tag">${m.label}</div></div>
    <div class="m-card">
      <div class="m-header"><span class="m-name">${m.nom}</span><span class="m-kcal">${tt ? '~' + tt.kcal + ' kcal' : m.tag}</span></div>
      ${tt ? `<div class="m-macros"><span class="mp p">P&nbsp;: ${tt.p}&nbsp;g</span><span class="mp c">G&nbsp;: ${tt.g}&nbsp;g</span><span class="mp f">L&nbsp;: ${tt.l}&nbsp;g</span></div>` : ''}
      <ul class="m-foods">${M.foodLines(m).map(x => `<li>${x}</li>`).join('')}</ul>
      ${m.note ? `<div class="m-note">${m.note}</div>` : ''}
    </div>
  </div>`;
    };
    return `<div class="page pb">
  <div class="doc-header" style="margin-bottom:14px">
    <div style="font-size:18pt;font-weight:900;letter-spacing:3px;color:#0b1020">NUTRITION <span style="color:#e8960a">${D.titreLong.replace('&', '&amp;')}</span></div>
    <div style="text-align:right;font-size:8pt;color:#6b7280">${D.seance ? 'Jour de muscu' + (h ? ' · séance ' + h : '') : 'Jour de ping-pong · club ' + f(N.pingpongHeures, 'n') + ' h'}<br><b>≈ ${int(t.kcal)} kcal · P ${t.p} g · G ${t.g} g · L ${t.l} g (cible ${int(c.kcal)} · ${c.p} · ${c.g} · ${c.l})</b></div>
  </div>
  ${D.repas.map(meal).join('\n')}
  ${foot('Nutrition ' + D.jours, n)}
</div>`;
  }

  // ── PAGE 7 : repos, compléments, charges ──
  function pageFin() {
    const D = M.DAYS.repos, t = M.dayTotal('repos'), c = M.target('repos');
    const rows = D.repas.map(m => { const tt = m.compo ? M.mealTotal(m) : null; return `<tr><td><b>${M.timeText('repos', m)}</b></td><td>${M.foodLines(m).join(' · ')}</td><td style="white-space:nowrap">${tt ? '~' + tt.kcal + ' kcal<br><span style="color:#6b7280">P' + tt.p + ' · G' + tt.g + ' · L' + tt.l + '</span>' : '—'}</td></tr>`; }).join('');
    const al = S.alerts();
    const supp = S.active().map(p => `<div class="supp-card"><div class="supp-name">${p.nom}</div><div class="supp-brand">${p.marque}</div>
      <div class="supp-row"><b>Dose :</b> ${p.dose}</div><div class="supp-row"><b>Quand :</b> ${p.quand}</div>
      ${p.effets.map(e => `<div class="supp-row"><b>Preuve ${e.preuve} :</b> ${e.effet}${e.verdict ? ' — ' + e.verdict : ''}</div>`).join('')}
      ${p.prudence ? `<div class="supp-row"><b>⚠️ Prudence :</b> ${p.prudence}</div>` : ''}</div>`).join('');
    const charges = ['dev-incline', 'tirage-vertical', 'arnold-press', 'ecarte-cable', 'rowing-unilateral', 'curl-alternes'].map(id => {
      const e = P.EXERCISES[id], ch = e.charges, x = ch.unit.indexOf('/') > 0 ? '2 × ' : '';
      return `<tr><td><b>${e.name}</b></td><td class="t-start">${x}${ch.b1[0]} kg</td><td class="t-tgt">${x}${ch.an1} kg</td><td><div class="pbar-wrap"><div class="pbar" style="width:${Math.round(ch.b1[0] / ch.an1 * 100)}%"></div></div></td></tr>`;
    }).join('');
    const B = P.BLOCKS;
    return `<div class="page pb">
  <div class="sh">Jours de Repos — ${D.jours} (${int(c.kcal)} kcal)</div>
  <table class="strength-table" style="margin-bottom:8px"><thead><tr><th>Heure</th><th>Repas</th><th>Macros</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="info-box gold" style="margin-bottom:14px"><p><b>Total ≈ ${int(t.kcal)} kcal · P ${t.p} g · G ${t.g} g · L ${t.l} g (cible ${int(c.kcal)} · ${c.p} · ${c.g} · ${c.l}).</b> ${D.remarque}</p></div>
  <div class="sh">Mes Compléments Alimentaires</div>
  ${al.length ? `<div class="info-box red" style="margin-bottom:10px"><h3>Cumul à corriger (limites EFSA, toutes sources)</h3><p>${al.map(a => a.texte).join(' ')}</p></div>` : ''}
  <div class="supp-grid">${supp}</div>
  <div class="sh">Repères de Charges — Départ → 12 Mois</div>
  <table class="strength-table"><thead><tr><th>Exercice</th><th>Charge de départ</th><th>Repère à 12 mois</th><th>Départ / repère</th></tr></thead><tbody>${charges}</tbody></table>
  <div class="info-box blue" style="margin-top:14px"><h3>Règle de progression des charges</h3><p><b>${B.B2.name}</b> (semaines ${B.B2.weeks}) : ${B.B2.desc} Aux haltères, un palier vaut 1 à 2 kg ; aux machines, 2,5 à 5 kg. Jamais d'augmentation si la technique se dégrade.</p></div>
  <div class="info-box green" style="margin-top:10px"><h3>Lexique RIR &amp; Tempo</h3><p><b>RIR</b> (Reps In Reserve) = répétitions gardées en réserve avant l'échec. Il évolue selon le bloc : <b>B1 = ${B.B1.rirC} · B2 = ${B.B2.rirC} · B3 = ${B.B3.rirC} (polyarticulaires) / ${B.B3.rirI} (isolations) · Deload = ${B.DL.rirC}</b>. L’onglet Séance affiche la bonne valeur chaque semaine. &nbsp;|&nbsp; <b>Tempo 3-1-2-0 :</b> 3 s de phase freinée (la charge descend ou le câble revient) · 1 s de pause en étirement · 2 s de phase d’effort · 0 s de pause en contraction.</p></div>
  ${foot('Programme complet · 12 mois', TOTAL)}
</div>`;
  }

  const doc = document.getElementById('doc');
  doc.innerHTML = [page1()].concat(P.ORDER.map(pageSeance)).concat([pageRepas('lj', TOTAL - 3), pageRepas('sam', TOTAL - 2), pageRepas('pingpong', TOTAL - 1), pageFin()]).join('\n');
  ALLEZ.bind(doc);
  const part = doc.querySelector('[data-prive="programme.particularites"]');
  if (part && !part.hidden) document.getElementById('rowParticularites').hidden = false;
})();
</script>
<script>
// Actions des boutons (délégation : core.js)
ALLEZ.actions({
  imprimer: function () { window.print(); }
});
</script>
</body>
</html>

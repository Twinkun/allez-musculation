<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1628"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b340"/>
      <stop offset="1" stop-color="#e8960a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gold accent top bar -->
  <rect x="60" y="52" width="392" height="7" rx="3.5" fill="url(#gold)" opacity="0.8"/>
  <!-- Main letter A -->
  <text x="256" y="372"
        font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
        font-size="330"
        font-weight="900"
        text-anchor="middle"
        fill="url(#gold)">A</text>
  <!-- Bottom label -->
  <text x="256" y="454"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="46"
        font-weight="700"
        text-anchor="middle"
        letter-spacing="14"
        fill="rgba(255,255,255,0.35)">ALLEZ</text>
  <!-- Gold accent bottom bar -->
  <rect x="60" y="468" width="392" height="5" rx="2.5" fill="url(#gold)" opacity="0.4"/>
</svg>
